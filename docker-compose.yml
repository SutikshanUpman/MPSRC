# docker compose up --build            the console on http://localhost:8000 (needs CONSOLE_PASSWORD, see .env.example)
# docker compose --profile local-models up --build     also an Ollama container (CPU unless you add a GPU reservation)
services:
  console:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./dev_pack_E5:/app/dev_pack_E5:ro
      - console-data:/data
    restart: unless-stopped

  ollama:
    profiles: ["local-models"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  console-data:
  ollama-models:
